<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#f7f6f3" />
<title>Aide — v4</title>
<style>
  :root {
    --bg: #f7f6f3;
    --surface: #ffffff;
    --ink: #1c1c1a;
    --ink-soft: #6b6a66;
    --ink-faint: #a8a69f;
    --line: rgba(28,28,26,0.08);
    --accent: #2a2a28;
    --chip: #efeee9;
    --chip-active: #1c1c1a;
    --chip-active-ink: #f7f6f3;
    --green: #2f6b4f;
    --warm: #c4a484;
    --shadow: 0 8px 28px rgba(28,28,26,0.08);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --morph: 320ms cubic-bezier(.2,.8,.2,1);
  }
  body.rough {
    --bg: #f3ebe3;
    --surface: #fffaf5;
    --ink: #3a322c;
    --ink-soft: #7a6d62;
    --ink-faint: #b0a194;
    --line: rgba(58,50,44,0.08);
    --accent: #5c4a3a;
    --chip: #ebe0d4;
    --green: #5a7a5a;
    --shadow: 0 8px 28px rgba(58,50,44,0.08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    transition: background .6s ease, color .6s ease;
  }
  body { display: flex; justify-content: center; align-items: stretch; }
  .phone {
    width: 100%; max-width: 430px; height: 100%;
    display: flex; flex-direction: column;
    position: relative; background: var(--bg);
    overflow: hidden; transition: background .6s ease;
  }

  .topbar {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(10px + var(--safe-top)) 14px 6px;
    z-index: 30; position: relative;
  }
  .icon-btn {
    width: 44px; height: 44px; border: 0; background: transparent;
    border-radius: 12px; display: grid; place-items: center; cursor: pointer;
    color: var(--ink);
  }
  .icon-btn:active { background: var(--line); }
  .icon-btn svg { width: 22px; height: 22px; }
  .icon-btn.back { opacity: 0; pointer-events: none; transition: opacity .2s; }
  .icon-btn.back.show { opacity: 1; pointer-events: auto; }
  .brand {
    font-size: 15px; font-weight: 560; letter-spacing: -0.01em;
    color: var(--ink-soft); opacity: 0.7;
  }

  .stage {
    flex: 1 1 auto; position: relative; overflow: hidden; min-height: 0;
  }
  .pins {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; gap: 10px; padding: 4px 16px 8px;
    overflow-x: auto; scrollbar-width: none; z-index: 15; pointer-events: none;
  }
  .pins::-webkit-scrollbar { display: none; }
  .pins:empty { display: none; }
  .pins > * { pointer-events: auto; }
  .pin-card {
    flex: 0 0 auto; background: var(--surface); border: 1px solid var(--line);
    border-radius: 16px; padding: 12px 14px; min-width: 124px; max-width: 168px;
    box-shadow: 0 2px 10px rgba(28,28,26,0.04); cursor: pointer; transition: transform .15s;
  }
  .pin-card:active { transform: scale(0.97); }
  .pin-card .pc-icon { font-size: 20px; line-height: 1; margin-bottom: 6px; }
  .pin-card .pc-title { font-size: 12px; color: var(--ink-soft); font-weight: 500; }
  .pin-card .pc-body { font-size: 15px; font-weight: 560; letter-spacing: -0.02em; margin-top: 2px; }
  .pin-card .pc-sub { font-size: 12px; color: var(--ink-faint); margin-top: 2px; }

  .view {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px 28px 16px;
    opacity: 0; transform: translateY(10px) scale(0.985);
    pointer-events: none;
    transition: opacity var(--morph), transform var(--morph);
    will-change: opacity, transform; overflow-y: auto;
  }
  .view.active { opacity: 1; transform: none; pointer-events: auto; }
  .view.exit-up { opacity: 0; transform: translateY(-12px) scale(0.99); }

  .home-hints {
    position: absolute; left: 28px; right: 28px; bottom: 12px;
    display: flex; flex-direction: column; gap: 6px;
    opacity: 0.42; pointer-events: none;
  }
  .home-hints .hint { font-size: 13px; color: var(--ink-soft); letter-spacing: -0.01em; }
  .home-hints em { font-style: normal; color: var(--ink-faint); }

  .hero-art {
    width: min(220px, 56vw); height: min(160px, 40vw);
    display: grid; place-items: center; margin-bottom: 28px;
  }
  .hero-art .emoji { font-size: 88px; line-height: 1; filter: saturate(0.92); }
  .modem-svg { width: 180px; height: 140px; }
  .q {
    font-size: 26px; font-weight: 650; letter-spacing: -0.035em;
    text-align: center; line-height: 1.2; max-width: 320px; margin: 0 0 10px;
  }
  .sub {
    font-size: 15px; color: var(--ink-soft); text-align: center;
    line-height: 1.4; max-width: 300px; margin: 0 0 28px;
  }
  .choices {
    display: flex; flex-direction: column; gap: 10px; width: min(300px, 100%);
  }
  .choice {
    min-height: 52px; border: 1px solid var(--line);
    background: var(--surface); border-radius: 16px;
    font-size: 17px; font-weight: 560; letter-spacing: -0.02em;
    color: var(--ink); cursor: pointer; font-family: inherit;
    box-shadow: 0 1px 3px rgba(28,28,26,0.04);
    transition: transform .12s, background .15s;
  }
  .choice:active { transform: scale(0.98); }
  .choice.primary { background: var(--accent); color: #faf9f6; border-color: transparent; }
  .choice.row { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .choice.soft { font-size: 15px; min-height: 46px; color: var(--ink-soft); }

  .order-card, .task-card, .learn-card, .weather-card, .done-hero, .cal-card, .draft-card, .info-card {
    width: min(320px, 100%);
  }
  .order-card, .cal-card, .draft-card, .info-card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 24px; overflow: hidden;
    box-shadow: 0 8px 32px rgba(28,28,26,0.08); margin-bottom: 18px;
  }
  .order-photo {
    height: 180px; display: grid; place-items: center;
    background: linear-gradient(150deg, #e6e3da, #f4f2ec); font-size: 72px;
  }
  .order-meta, .cal-meta, .draft-meta, .info-meta { padding: 18px 20px 16px; }
  .order-meta .t, .cal-meta .t, .draft-meta .t, .info-meta .t {
    font-size: 18px; font-weight: 650; letter-spacing: -0.02em;
  }
  .order-meta .s, .cal-meta .s, .draft-meta .s, .info-meta .s {
    font-size: 14px; color: var(--ink-soft); margin-top: 4px; line-height: 1.4;
  }
  .cal-photo {
    height: 120px; display: grid; place-items: center;
    background: linear-gradient(150deg, #dde8f0, #f0f4f7); font-size: 56px;
  }
  .info-photo {
    height: 140px; display: grid; place-items: center;
    background: linear-gradient(150deg, #e8efe6, #f4f7f2); font-size: 64px;
  }
  .symptom-list {
    margin: 0; padding: 0 20px 16px 36px; color: var(--ink-soft); font-size: 14px; line-height: 1.55;
  }
  .draft-body {
    margin: 0 20px 16px; padding: 14px 16px; background: var(--bg);
    border-radius: 14px; font-size: 14px; color: var(--ink); line-height: 1.5;
    white-space: pre-wrap;
  }
  .comment-row {
    display: flex; gap: 8px; width: min(320px, 100%); margin-top: 4px; margin-bottom: 12px;
  }
  .comment-row input {
    flex: 1; border: 1px solid var(--line); background: var(--surface);
    border-radius: 14px; padding: 12px 14px; font-size: 15px; font-family: inherit;
    color: var(--ink); outline: none;
  }
  .comment-row .send-mini {
    width: 44px; height: 44px; border: 0; border-radius: 50%;
    background: var(--accent); color: #fff; display: grid; place-items: center; cursor: pointer; flex: 0 0 auto;
  }
  .comment-row .send-mini svg { width: 16px; height: 16px; }
  .saved-note {
    width: min(320px, 100%); font-size: 13px; color: var(--green);
    background: rgba(47,107,79,0.08); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px;
  }

  .done-hero { text-align: center; }
  .done-hero .check {
    width: 72px; height: 72px; border-radius: 50%;
    background: rgba(47,107,79,0.12); color: var(--green);
    display: grid; place-items: center; margin: 0 auto 18px;
  }
  .done-hero .check svg { width: 34px; height: 34px; }
  .done-hero .t { font-size: 24px; font-weight: 650; letter-spacing: -0.03em; }
  .done-hero .s { font-size: 15px; color: var(--ink-soft); margin-top: 8px; }
  .weather-card { text-align: center; }
  .weather-card .deg { font-size: 72px; font-weight: 300; letter-spacing: -0.04em; line-height: 1; }
  .weather-card .cond { font-size: 20px; font-weight: 560; margin-top: 4px; }
  .weather-card .loc { font-size: 14px; color: var(--ink-soft); margin-top: 8px; }
  .learn-pill, .tiny-done {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px 16px; font-size: 14px; color: var(--green); font-weight: 560;
  }
  .learn-pill { margin-top: 18px; }
  .tiny-done { font-size: 15px; }

  .unfinished-list, .priority-list {
    width: min(340px, 100%); display: flex; flex-direction: column; gap: 12px;
    max-height: 100%; overflow-y: auto; padding: 8px 0;
  }
  .uf-item, .pr-item {
    display: flex; gap: 14px; align-items: center;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 18px; padding: 14px 16px; text-align: left;
    cursor: pointer; font-family: inherit; color: inherit; width: 100%;
    box-shadow: 0 2px 10px rgba(28,28,26,0.04);
  }
  .uf-item:active, .pr-item:active { transform: scale(0.98); }
  .uf-icon, .pr-icon {
    width: 48px; height: 48px; border-radius: 14px;
    background: var(--chip); display: grid; place-items: center; font-size: 24px; flex: 0 0 auto;
  }
  .uf-body, .pr-body { flex: 1; min-width: 0; }
  .uf-body .t, .pr-body .t { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .uf-body .s, .pr-body .s { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }

  .tv-row {
    display: flex; gap: 10px; width: min(340px, 100%); max-width: 340px; justify-content: center;
    overflow-x: auto; padding: 4px 2px 12px; scrollbar-width: none;
  }
  .tv-row::-webkit-scrollbar { display: none; }
  .tv-card {
    flex: 0 0 104px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 18px; overflow: hidden; text-align: left;
    box-shadow: 0 4px 16px rgba(28,28,26,0.06); cursor: pointer;
  }
  .tv-card:active { transform: scale(0.97); }
  .tv-art {
    height: 90px; display: grid; place-items: center; font-size: 36px;
  }
  .tv-art.a { background: linear-gradient(145deg, #1a1a2e, #3d3d5c); }
  .tv-art.b { background: linear-gradient(145deg, #0f2027, #2c5364); }
  .tv-art.c { background: linear-gradient(145deg, #232526, #414345); }
  .tv-meta { padding: 10px 12px 12px; }
  .tv-meta .name { font-size: 12px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.25; }
  .tv-meta .price { font-size: 15px; font-weight: 600; margin-top: 4px; }
  .tv-meta .tag { font-size: 11px; color: var(--ink-faint); margin-top: 3px; }
  .example-badge {
    font-size: 11px; color: var(--ink-faint); text-align: center; margin-bottom: 10px; letter-spacing: 0.02em;
  }

  .quiet-state { text-align: center; max-width: 280px; }
  .quiet-state .orb {
    width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 22px;
    background: radial-gradient(circle at 40% 35%, rgba(28,28,26,0.06), transparent 70%);
    border: 1px solid var(--line); display: grid; place-items: center;
  }
  .quiet-state .orb span { width: 10px; height: 10px; border-radius: 50%; background: var(--ink-faint); opacity: 0.5; }
  .quiet-state .t { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
  .quiet-state .s { font-size: 15px; color: var(--ink-soft); margin-top: 8px; line-height: 1.4; }

  .night-card {
    width: min(320px, 100%); background: var(--surface); border: 1px solid var(--line);
    border-radius: 22px; padding: 22px 20px; text-align: left;
    box-shadow: 0 8px 28px rgba(28,28,26,0.06);
  }
  .night-card .rule { font-size: 15px; font-weight: 600; margin-bottom: 14px; }
  .night-row {
    display: flex; gap: 12px; align-items: flex-start; padding: 10px 0;
    border-top: 1px solid var(--line); font-size: 14px;
  }
  .night-row .dot {
    width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex: 0 0 auto;
  }
  .night-row .dot.hold { background: var(--ink-faint); }
  .night-row .dot.ping { background: var(--green); }
  .night-row .lbl { color: var(--ink); font-weight: 560; }
  .night-row .why { color: var(--ink-soft); margin-top: 2px; font-size: 13px; }

  .mood-banner {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(196,164,132,0.18); color: #6b5340;
    border-radius: 14px; padding: 10px 14px; font-size: 13px; font-weight: 560; margin-bottom: 18px;
  }

  .swipe-hint {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    width: 36px; height: 4px; border-radius: 4px; background: var(--line);
    opacity: 0; transition: opacity .2s;
  }
  .view.active .swipe-hint { opacity: 1; }

  .composer-wrap {
    flex: 0 0 auto;
    padding: 8px 16px calc(14px + var(--safe-bottom));
    background: linear-gradient(to top, var(--bg) 75%, transparent);
    z-index: 40; position: relative; transition: background .6s ease;
  }
  .status-line {
    font-size: 12px; color: var(--ink-faint); text-align: center;
    padding: 0 8px 6px; min-height: 0;
  }
  .composer {
    display: flex; align-items: flex-end; gap: 8px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 24px; padding: 6px 6px 6px 18px;
    box-shadow: var(--shadow);
    transition: box-shadow .2s, border-color .2s, background .6s ease;
  }
  .composer.thinking { animation: softglow 1.6s ease-in-out infinite; }
  .composer input {
    flex: 1; border: 0; outline: none; background: transparent;
    font-size: 16px; line-height: 1.3; padding: 10px 0;
    color: var(--ink); font-family: inherit; min-height: 44px;
  }
  .composer input::placeholder { color: var(--ink-faint); }
  .send {
    width: 44px; height: 44px; border: 0; border-radius: 50%;
    background: var(--accent); color: #fff;
    display: grid; place-items: center; cursor: pointer; flex: 0 0 auto;
  }
  .send:disabled { opacity: 0.35; }
  .send svg { width: 18px; height: 18px; }

  .scrim {
    position: absolute; inset: 0; background: rgba(28,28,26,0.28);
    opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 50;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: absolute; top: 0; left: 0; bottom: 0;
    width: min(86%, 340px); background: var(--surface);
    border-right: 1px solid var(--line);
    transform: translateX(-105%);
    transition: transform .3s cubic-bezier(.2,.8,.2,1);
    z-index: 60; display: flex; flex-direction: column;
    padding-top: var(--safe-top);
    box-shadow: 8px 0 40px rgba(28,28,26,0.12);
  }
  .drawer.open { transform: translateX(0); }
  .drawer-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 16px 8px 20px;
  }
  .drawer-head h2 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.03em; }
  .drawer-note { padding: 0 20px 12px; font-size: 13px; color: var(--ink-soft); line-height: 1.4; }
  .drawer-scroll { flex: 1; overflow-y: auto; padding: 4px 14px 24px; }
  .section-label {
    font-size: 12px; font-weight: 600; color: var(--ink-faint);
    letter-spacing: 0.04em; text-transform: uppercase; margin: 14px 6px 8px;
  }
  .widget-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .wcard {
    position: relative; background: var(--bg); border: 1px solid var(--line);
    border-radius: 16px; padding: 14px 12px 12px; min-height: 108px;
    cursor: pointer; text-align: left; font-family: inherit; color: inherit;
  }
  .wcard.on { border-color: rgba(28,28,26,0.35); background: #fff; box-shadow: 0 2px 10px rgba(28,28,26,0.06); }
  .wcard .wi { font-size: 26px; margin-bottom: 10px; display: block; }
  .wcard .wt { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
  .wcard .ws { font-size: 11px; color: var(--ink-soft); margin-top: 3px; line-height: 1.3; }
  .wcard .badge {
    position: absolute; top: 10px; right: 10px; width: 22px; height: 22px;
    border-radius: 50%; background: var(--accent); color: #fff;
    display: none; place-items: center; font-size: 12px;
  }
  .wcard.on .badge { display: grid; }
  .active-list { display: flex; flex-direction: column; gap: 6px; }
  .active-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--bg); border-radius: 12px; padding: 10px 12px; border: 1px solid var(--line);
  }
  .active-row .n { flex: 1; font-size: 14px; font-weight: 500; }
  .active-row .x {
    width: 36px; height: 36px; border: 0; background: transparent;
    border-radius: 10px; color: var(--ink-soft); cursor: pointer; font-size: 18px;
  }
  .demo-list { display: flex; flex-direction: column; gap: 6px; }
  .demo-btn {
    display: flex; align-items: center; gap: 10px; width: 100%;
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 12px; text-align: left; font-family: inherit; color: inherit; cursor: pointer;
  }
  .demo-btn:active { transform: scale(0.98); }
  .demo-btn .dn { font-size: 12px; font-weight: 700; color: var(--ink-faint); width: 22px; }
  .demo-btn .dt { font-size: 13px; font-weight: 560; letter-spacing: -0.01em; }

  /* Face ID lock */
  .faceid {
    position: absolute; inset: 0; z-index: 100;
    background: #0c0c0b; color: #f7f6f3;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity .35s ease, visibility .35s;
  }
  .faceid.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .faceid .ring {
    width: 88px; height: 88px; border-radius: 50%;
    border: 2px solid rgba(247,246,243,0.35);
    display: grid; place-items: center; margin-bottom: 28px;
  }
  .faceid .ring svg { width: 42px; height: 42px; opacity: 0.9; }
  .faceid .ft { font-size: 17px; font-weight: 500; letter-spacing: -0.01em; margin-bottom: 8px; }
  .faceid .fs { font-size: 13px; opacity: 0.55; margin-bottom: 36px; }
  .faceid .unlock {
    min-width: 160px; min-height: 48px; border: 1px solid rgba(247,246,243,0.25);
    background: rgba(247,246,243,0.08); color: #f7f6f3; border-radius: 14px;
    font-size: 15px; font-weight: 560; font-family: inherit; cursor: pointer;
  }
  .faceid .unlock:active { background: rgba(247,246,243,0.16); }

  @keyframes softglow {
    0%, 100% { box-shadow: 0 8px 28px rgba(28,28,26,0.08); border-color: var(--line); }
    50% { box-shadow: 0 8px 36px rgba(28,28,26,0.16), 0 0 0 3px rgba(28,28,26,0.04); border-color: rgba(28,28,26,0.2); }
  }

  .warn-banner {
    display: inline-flex; align-items: flex-start; gap: 10px;
    background: rgba(180,80,50,0.10); color: #7a3e28;
    border-radius: 14px; padding: 12px 14px; font-size: 13px; font-weight: 560;
    margin-bottom: 14px; max-width: min(320px,100%); line-height: 1.4; text-align: left;
  }
  .side-row {
    display: flex; gap: 10px; width: min(340px, 100%); margin-bottom: 12px;
  }
  .side-card {
    flex: 1; background: var(--surface); border: 1px solid var(--line);
    border-radius: 18px; padding: 14px 12px; text-align: center;
    box-shadow: 0 4px 16px rgba(28,28,26,0.05);
  }
  .side-card .day { font-size: 12px; color: var(--ink-soft); font-weight: 560; }
  .side-card .icon { font-size: 36px; margin: 8px 0; }
  .side-card .hi { font-size: 22px; font-weight: 650; letter-spacing: -0.03em; }
  .side-card .lo { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
  .side-card .note { font-size: 12px; color: var(--ink-faint); margin-top: 6px; line-height: 1.3; }
  .chip-row {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    width: min(320px, 100%); margin-top: 16px;
  }
  .chip {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    border-radius: 999px; padding: 10px 14px; font-size: 14px; font-weight: 560;
    font-family: inherit; cursor: pointer;
  }
  .chip.on { background: var(--accent); color: #faf9f6; border-color: transparent; }
  .chip:active { transform: scale(0.97); }
  .steps {
    width: min(320px,100%); text-align: left; margin: 0 0 16px;
    padding: 0; list-style: none; counter-reset: step;
  }
  .steps li {
    counter-increment: step; position: relative;
    padding: 10px 12px 10px 44px; margin-bottom: 8px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    font-size: 14px; line-height: 1.4;
  }
  .steps li::before {
    content: counter(step); position: absolute; left: 12px; top: 10px;
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--chip); display: grid; place-items: center;
    font-size: 12px; font-weight: 700; color: var(--ink-soft);
  }
  .parts {
    width: min(320px,100%); text-align: left; margin: 0 0 16px;
    padding: 12px 14px; background: var(--bg); border-radius: 14px;
    font-size: 13px; color: var(--ink-soft); line-height: 1.5;
  }
  .parts strong { color: var(--ink); font-weight: 600; display: block; margin-bottom: 4px; }
  .late-note {
    font-size: 13px; color: var(--ink-soft); background: rgba(28,28,26,0.04);
    border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; text-align: center;
  }
  .away-list { width: min(340px,100%); display: flex; flex-direction: column; gap: 10px; }
  .away-item {
    display: flex; gap: 12px; align-items: flex-start;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 16px; padding: 12px 14px; text-align: left;

  .away-item .ai { font-size: 22px; line-height: 1; }
  .away-item .at { font-size: 14px; font-weight: 600; }
  .away-item .as { font-size: 12px; color: var(--ink-soft); margin-top: 2px; line-height: 1.35; }
  .faceid-inline {
    width: min(280px,100%); background: #0c0c0b; color: #f7f6f3;
    border-radius: 22px; padding: 28px 20px; text-align: center; margin-bottom: 16px;
  }
  .faceid-inline .ring {
    width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 14px;
    border: 2px solid rgba(247,246,243,0.35); display: grid; place-items: center;
  }
  .faceid-inline .ring svg { width: 30px; height: 30px; }
  .faceid-inline .ft { font-size: 15px; font-weight: 560; margin-bottom: 4px; }
  .faceid-inline .fs { font-size: 12px; opacity: 0.55; }
  .hw-body {
    width: min(320px,100%); background: var(--surface); border: 1px solid var(--line);
    border-radius: 20px; padding: 18px 18px; text-align: left; margin-bottom: 4px;
    box-shadow: 0 4px 16px rgba(28,28,26,0.05); font-size: 15px; line-height: 1.45;
  }
  .hw-body .hw-t { font-size: 17px; font-weight: 650; letter-spacing: -0.02em; margin-bottom: 8px; }
  .hw-pic { text-align: center; font-size: 64px; padding: 12px 0; }

</style>

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function wait(ms){ return new Promise(r => setTimeout(r, ms)); }

function setBackVisible(on) {

}

let morphLock = false;
async function showView(id, data={}, {push=true, autoHomeMs=0}={}) {
  if (morphLock) await wait(60);
  morphLock = true;
  const prev = el.viewRoot;
  const next = document.createElement('div');
  next.className = 'view';
  next.dataset.id = id;
  next.innerHTML = buildViewHTML(id, data);
  el.stage.appendChild(next);
  void next.offsetWidth;
  prev.classList.add('exit-up');
  prev.classList.remove('active');
  next.classList.add('active');
  wireView(next, data);
  await wait(320);
  prev.remove();
  el.viewRoot = next;
  if (push && state.currentView !== id) {
    if (state.currentView) state.history.push({ id: state.currentView, data: state._lastData });
  }
  state.currentView = id;
  state._lastData = data;
  setBackVisible(id !== 'home' && state.history.length > 0);
  el.pins.style.visibility = id === 'home' ? 'visible' : 'hidden';
  morphLock = false;
  if (autoHomeMs > 0) {
    await wait(autoHomeMs);
    if (state.currentView === id) goHome();
  }
}

function goHome() {
  state.history = [];
  showView('home', {}, {push:false});
  setBackVisible(false);
}

function goBack() {
  const prev = state.history.pop();
  if (!prev) { goHome(); return; }
  showView(prev.id, prev.data || {}, {push:false});
}

el.backBtn.addEventListener('click', goBack);

(function swipeBack() {
  let y0 = null;
  el.stage.addEventListener('touchstart', e => {
    if (state.currentView === 'home') return;
    y0 = e.touches[0].clientY;
  }, {passive:true});
  el.stage.addEventListener('touchend', e => {
    if (y0 == null) return;
    const dy = e.changedTouches[0].clientY - y0;
    y0 = null;
    if (dy > 70) goBack();
  }, {passive:true});
})();

function wireView(node, data) {
  node.querySelectorAll('[data-act]').forEach(btn => {
    btn.addEventListener('click', () => onAct(btn.dataset.act, btn.dataset, data));
  });
}

function upsertTask(task) {
  const i = state.tasks.findIndex(t => t.id === task.id);
  if (i >= 0) state.tasks[i] = {...state.tasks[i], ...task};
  else state.tasks.push(task);
  renderPins();
}
function completeTask(id) {
  const t = state.tasks.find(x => x.id === id);
  if (t) t.done = true;
  renderPins();
}
function openTasks() { return state.tasks.filter(t => !t.done); }

function resumeTask(id) {
  const t = state.tasks.find(x => x.id === id);
  if (!t || t.done) return;
  if (t.kind === 'modem') showView('modem-ask');
  else if (t.kind === 'cancel') showView('cancel');
  else if (t.kind === 'location') showView('location');
  else if (t.kind === 'haircut') showView('haircut-am', {hour: t.hour || 3});
  else if (t.kind === 'vet-remind') showView('skip3');
  else if (t.kind === 'crash-tv') showView('tv');
  else if (t.kind === 'flyer') showView('flyer');
}

async function maybeNudgeRelated(kind) {
  if (state.neverShowUnfinished || state.remindLess || state.remindersHeld) return false;
  if (state.relatedNudgeUsed[kind]) return false;
  const t = openTasks().find(x => x.kind === kind);
  if (!t) return false;
  state.relatedNudgeUsed[kind] = true;
  await think('…', 400);
  await showView('nudge', {task: t});
  return true;
}

function setThinking(on, status) {
  el.composer.classList.toggle('thinking', on && state.thinkingMode === 'pulse');
  el.statusLine.textContent = (on && state.thinkingMode === 'status') ? (status || 'Thinking…') : '';
}
async function think(status, ms=650) {
  if (state.thinkingMode === 'off') { await wait(Math.min(ms, 280)); return; }
  setThinking(true, status);
  await wait(ms);
  setThinking(false);
}

function setRoughDay(on) {
  state.roughDay = on;
  state.remindersHeld = on;
  document.body.classList.toggle('rough', on);
  renderPins();
}

  el.faceid.classList.remove('hidden');

function hideFaceId() {
  el.faceid.classList.add('hidden');
}

async function onAct(act, ds={}, data={}) {
  if (state.busy) return;
  state.busy = true;
  try {
    if (act === 'modem-red') {
      upsertTask({id:'seed-modem', kind:'modem', step:'red', title:'Internet down', sub:'Power cycle in progress', icon:'📡', done:false});
      await think('…', 400); await showView('modem-red');
    } else if (act === 'modem-blink') {
      upsertTask({id:'seed-modem', kind:'modem', step:'blink', title:'Internet down', sub:'Waiting on blink', icon:'📡', done:false});
      await think('…', 400); await showView('modem-blink');
    } else if (act === 'modem-green') {
      upsertTask({id:'seed-modem', kind:'modem', step:'green', title:'Internet down', sub:'Checking device', icon:'📡', done:false});
      await think('…', 400); await showView('modem-green');
    } else if (act === 'modem-ask') {
      await think('…', 300); await showView('modem-ask');
    } else if (act === 'modem-done') {
      completeTask('seed-modem');
      await think('…', 350);
      await showView('done', {title:'Got it', sub:'You’re back online'}, {autoHomeMs:1400});
    } else if (act === 'cancel-yes') {
      completeTask('seed-cancel');
      await think('Canceling…', 500);
      await showView('done', {title:'Canceled', sub:'Refund in 3–5 days'}, {autoHomeMs:1400});
    } else if (act === 'cancel-no') {
      completeTask('seed-cancel');
      await think('…', 300);
      await showView('done', {title:'Kept', sub:'Arrives Thursday'}, {autoHomeMs:1400});
    } else if (act === 'loc-allow') {
      state.locationOk = true;
      await think('…', 350);
      if (state.homeSet) {
        completeTask('loc-remind');
        await showView('done', {title:'Got it', sub:'I’ll remind you when you leave for home'}, {autoHomeMs:1500});
      } else {
        upsertTask({id:'loc-remind', kind:'location', title:'Dog food reminder', sub:'Needs home address', icon:'📍', done:false});
        await showView('location');
      }
    } else if (act === 'loc-home') {
      state.homeSet = true;
      await think('…', 350);
      if (state.locationOk) {
        completeTask('loc-remind');
        await showView('done', {title:'Got it', sub:'I’ll remind you when you leave for home'}, {autoHomeMs:1500});
      } else {
        upsertTask({id:'loc-remind', kind:'location', title:'Dog food reminder', sub:'Needs location', icon:'📍', done:false});
        await showView('location');
      }
    } else if (act === 'hair-ok') {
      state.pendingBooking = null;
      completeTask('haircut');
      const h = (data.hour || 3);
      await think('…', 300);
      await showView('done', {title:`Booked — ${h}:00 AM`}, {autoHomeMs:1300});
    } else if (act === 'hair-pm') {
      state.learned.haircut = 'pm';
      state.pendingBooking = null;
      completeTask('haircut');
      const h = (data.hour || 3);
      await think('Fixing…', 400);
      await showView('done', {title:`Got it — ${h}:00 PM`, learn:'Learned: haircuts are afternoons'}, {autoHomeMs:1800});
    } else if (act === 'hair-pick-am' || act === 'hair-pick-pm') {
      const mer = act.endsWith('am') ? 'am' : 'pm';
      state.learned.haircut = mer;
      completeTask('haircut');
      const h = data.hour || 7;
      await think('Booking…', 400);
      await showView('done', {title:`Booked — ${h}:00 ${mer.toUpperCase()}`}, {autoHomeMs:1400});
    } else if (act === 'resume') {
      resumeTask(ds.task);
    } else if (act === 'dismiss-task') {
      completeTask(ds.task);
      await showView('tiny-done', {title:'Done — dismissed'}, {autoHomeMs:900});
    } else if (act === 'go-home') {
      goHome();
    } else if (act === 'pin-leftoff') {
      if (!state.pins.includes('leftoff')) state.pins.push('leftoff');
      renderPins(); renderGallery();
      await showView('tiny-done', {title:'Done — Where we left off on home'}, {autoHomeMs:1100});
    } else if (act === 'pin-priorities') {
      if (!state.pins.includes('priorities')) state.pins.push('priorities');

function togglePin(id) {

function removePin(id) {
  state.pins = state.pins.filter(x => x !== id);

function matchWidget(name) {
  const n = name.toLowerCase().replace(/[^a-z\s\/]/g,'').trim();
  const map = {
    weather:'weather', reminders:'reminders', reminder:'reminders',
    calendar:'calendar', timer:'timer', notes:'notes', note:'notes',
    commute:'commute', 'photo list':'photolist', photolist:'photolist', photos:'photolist',
    news:'news', unfinished:'unfinished', 'unfinished widget':'unfinished', tasks:'unfinished', 'open tasks':'unfinished',
    'where we left off':'leftoff', leftoff:'leftoff', 'left off':'leftoff',
    priorities:'priorities', priority:'priorities', 'tasks priorities':'priorities', 'task list':'priorities', 'priority list':'priorities',
    away:'away', 'while you were away':'away', 'while away':'away', catchup:'away', digest:'away'
  };
  if (map[n]) return map[n];
  for (const w of WIDGETS) {
    if (n.includes(w.id) || w.name.toLowerCase().includes(n) || n.includes(w.name.toLowerCase())) return w.id;
  }
  if (/unfinished/.test(n)) return 'unfinished';
  if (/left\s*off|where we/.test(n)) return 'leftoff';
  if (/priorit/.test(n)) return 'priorities';
  if (/while.*away|catch.?up|digest/.test(n)) return 'away';
  return null;
}

async function handle(raw) {
  state.busy = true;
  el.send.disabled = true;
  const t = raw.toLowerCase().trim();
  try {
    // Demo triggers
    const demoM = t.match(/^demo\s+(dinner|skip|flyer|drive|rough|leo|night|tv|crash|faceid|risky|wrong|pizza|fiber|cantsee|money|late|homework|weather|away|\d+)$/);
    if (demoM) {
      const map = {dinner:1,skip:2,flyer:3,drive:4,rough:5,leo:6,night:7,tv:8,crash:9,faceid:10,risky:11,wrong:12,pizza:13,fiber:14,cantsee:15,money:16,late:17,homework:18,weather:19,away:20};
      const n = map[demoM[1]] || parseInt(demoM[1],10);
      await runDemo(n); return;
    }

    // Face ID settings
    if (/turn off face\s*id|disable face\s*id|face\s*id off/.test(t)) {
      state.faceIdOn = false; hideFaceId();
      await think('Updating…', 350);
      await showView('tiny-done', {title:'Done — Face ID off for this demo'}, {autoHomeMs:1100}); return;
    }
    if (/turn on face\s*id|enable face\s*id|face\s*id on|lock with face/.test(t)) {
      state.faceIdOn = true;
      await think('Updating…', 350);
      await showView('tiny-done', {title:'Done — Face ID on. It’ll ask next open'}, {autoHomeMs:1200}); return;
    }

    // Where was I / crash recovery
    if (/where was i|where we left off|what was i doing|resume/.test(t)) {
      await think('…', 400); await showView('leftoff'); return;
    }

    // Rough day off via chat
    if (/i.?m fine|turn off rough|normal mode|end rough day/.test(t) && state.roughDay) {
      setRoughDay(false);
      await think('Updating…', 350);
      await showView('tiny-done', {title:'Done — back to normal'}, {autoHomeMs:1000}); return;

    if (/drive mode|i.?m driving|on bluetooth|heading out/.test(t)) {

    // Flyer / photo intents
    if (/school flyer|flyer photo|spring concert|sign (the )?slip/.test(t)) {
      state.flyerNote = '';
      await think('Looking at the photo…', 700); await showView('flyer'); return;
    }

    if (/leo (got|ate|into)|dog (ate|got into)|grapes|what.*(leo|dog).*into/.test(t)) {

    }

    // Night / bot news
    if (/9\s*pm|bot news|other bots|ping me tonight|held for morning/.test(t)) {

    }

    // Skipped reminder
    if (/skipped|book leo|vet checkup|checkup for leo/.test(t)) {

    }

    if (/dinner mode|coming back|kid interrupt/.test(t)) {

    if (/rough day|hard day|soft(er)? (tone|colors)|hold reminders/.test(t)) {
      setRoughDay(true);

      await think('…', 450); await showView('homework', {mode:'simple'}); return;

    }
    if (/while (you|i) were away|back after|been away|what did i miss/.test(t)) {

    if (/show what you.?re doing|show status|status line/.test(t)) {

      await showView('tiny-done', {title:"Done — I'll show a short status line"}, {autoHomeMs:1000}); return;

  } finally {
    state.busy = false;
    el.send.disabled = !el.input.value.trim();
  }
}

/* boot — Face ID then blank home */
el.viewRoot.innerHTML = renderHome();
el.viewRoot.classList.add('active');
el.viewRoot.dataset.id = 'home';
state.currentView = 'home';
closeMenu();
renderPins();
renderGallery();
renderDemos();
if (state.faceIdOn) showFaceId();
else hideFaceId();
</script>
</body>
</html>
